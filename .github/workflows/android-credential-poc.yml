name: Android Credential Signing PoC APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'poc/android-credential-signing/**'
      - '.github/workflows/android-credential-poc.yml'

permissions:
  contents: read

jobs:
  build-test-apk:
    name: Build dev/test PoC APK
    runs-on: ubuntu-latest
    env:
      PLATFORM_API: '35'
      BUILD_TOOLS_VERSION: '35.0.0'
      POC_PACKAGE: kr.or.aikido.samsungdang.dojolog.credentialpoc
      POC_VERSION_NAME: 0.0.1-dev
      POC_VERSION_CODE: '1'
      POC_LABEL: Samsungdang Credential Signing PoC (dev/test)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-$PLATFORM_API" "build-tools;$BUILD_TOOLS_VERSION"

      - name: Build independent unsigned PoC APK
        shell: bash
        run: |
          set -euo pipefail
          bash poc/android-credential-signing/build.sh \
            --sdk-root "$ANDROID_HOME" \
            --output-dir "$RUNNER_TEMP/credential-poc"

      - name: Generate ephemeral test-only APK certificate and sign
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/test-only.jks"
          STOREPASS='test-only-not-production'
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" -storetype PKCS12 \
            -storepass "$STOREPASS" -keypass "$STOREPASS" \
            -alias test-only -keyalg RSA -keysize 2048 -validity 2 \
            -dname 'CN=Samsungdang DojoLog Credential PoC Test Only,OU=Dev Test,O=Samsungdang,L=Incheon,C=KR'
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" sign \
            --ks "$KEYSTORE" --ks-pass "pass:$STOREPASS" --key-pass "pass:$STOREPASS" \
            --ks-key-alias test-only \
            --out "$RUNNER_TEMP/credential-poc/Samsungdang-DojoLog-Credential-PoC.apk" \
            "$RUNNER_TEMP/credential-poc/credential-poc-unsigned.apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" --version
          rm -f "$KEYSTORE"

      - name: Verify APK identity and test-only signing
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/credential-poc/Samsungdang-DojoLog-Credential-PoC.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='$POC_PACKAGE' versionCode='$POC_VERSION_CODE' versionName='$POC_VERSION_NAME'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "sdkVersion:'23'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "targetSdkVersion:'35'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "launchable-activity: name='${POC_PACKAGE}.CredentialSigningPocActivity'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F 'CN=Samsungdang DojoLog Credential PoC Test Only' "$RUNNER_TEMP/apksigner.txt"
          ! grep -F 'kr.or.aikido.samsungdang.dojolog.instructor' "$RUNNER_TEMP/apk-badging.txt"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: Samsungdang-DojoLog-Credential-PoC
          path: ${{ runner.temp }}/credential-poc/Samsungdang-DojoLog-Credential-PoC.apk
          if-no-files-found: error
          retention-days: 14
